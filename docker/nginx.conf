server {
    listen 5173 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_tokens off;

    # 'self' covers the default same-origin proxy setup below; __API_ORIGIN__
    # is replaced by the entrypoint with VITE_API_BASE_URL from data/.env
    # (fallback https://localhost:8000) for custom direct-API deployments.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript text/xml application/xml;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # Bot imports can carry sizeable strategy JSON payloads
    client_max_body_size 10m;

    # Same-origin API proxy — the backend serves HTTPS with a self-signed
    # cert inside the compose network, so upstream TLS verification is off.
    # "backend" is the compose service name; Docker's embedded DNS resolves
    # it at nginx startup (backend is healthy before nginx starts via
    # depends_on: condition: service_healthy).
    # ^~ prevents the static-asset regex location from shadowing API paths.
    # The apex_session Set-Cookie from the backend must pass through as-is:
    # no proxy_cookie_path / proxy_cookie_domain rewrites here.
    location ^~ /api/ {
        proxy_pass https://backend:8000;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backfill triggers can take a while to respond
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass https://backend:8000;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets with hashed filenames (Vite includes content hash)
    location ~* \.(js|css|png|jpg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never cache the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
    }

    # SPA fallback — return index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
